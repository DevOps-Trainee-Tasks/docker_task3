global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: llm-node
    ec2_sd_configs:
      - port: 9100
        filters:
          - name: tag:Name
            values: [ollama]
          - name: instance-state-name
            values: [running]
