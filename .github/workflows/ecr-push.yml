name: Push Docker images to ECR

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push changed images
        env:
          BEFORE: ${{ github.event.before }}
          ECR: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          for image in ollama open-webui prometheus grafana db-init ecs-exporter log-router; do
            if ! git diff --quiet "$BEFORE" HEAD -- "$image/"; then
              tag="${ECR}/${image}:${GITHUB_SHA:0:5}"
              docker build -t "$tag" "./$image"
              docker push "$tag"
            fi
          done
