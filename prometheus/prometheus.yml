global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ollama-ecs
    dns_sd_configs:
      - names: ["ollama.task3.local"]
        type: A
        port: 9779

  - job_name: webui-ecs
    dns_sd_configs:
      - names: ["webui.task3.local"]
        type: A
        port: 9779

  - job_name: grafana-ecs
    dns_sd_configs:
      - names: ["grafana.task3.local"]
        type: A
        port: 9779

  - job_name: prometheus-ecs
    static_configs:
      - targets: ["localhost:9779"]

  - job_name: service-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://ollama.task3.local:11434/api/tags"]
        labels:
          service: ollama
      - targets: ["http://webui.task3.local:8080/health"]
        labels:
          service: webui
      - targets: ["http://grafana.task3.local:3000/grafana/api/health"]
        labels:
          service: grafana
      - targets: ["http://127.0.0.1:9090/-/healthy"]
        labels:
          service: prometheus
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
