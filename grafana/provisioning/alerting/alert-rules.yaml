      - uid: bg38020xacqo0c
        title: ollama-ecs-high-cpu
        annotations:
          description: "Використання CPU на Ollama ECS перевищує 80% протягом 5 хвилин."
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: P034F075C744B399F
            model:
              datasource:
                type: cloudwatch
                uid: P034F075C744B399F
              expression: 'SEARCH(''{ECS/ContainerInsights,ClusterName,ServiceName} MetricName="TaskCpuUtilization" ClusterName="task2-cluster" ServiceName="task2-ollama"'', ''Average'', 60)'
              hide: false
              id: ""
              instant: true
              intervalMs: 1000
              label: ""
              logGroups: []
              maxDataPoints: 43200
              metricEditorMode: 1
              metricName: TaskCpuUtilization
              metricQueryType: 0
              namespace: ECS/ContainerInsights
              period: "60"
              queryLanguage: CWLI
              queryMode: Metrics
              refId: A
              region: default
              sqlExpression: ""
              statistic: Average
          - refId: reducer
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: reducer
              type: reduce
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: reducer
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        isPaused: false
        notification_settings:
          receiver: llm-email
