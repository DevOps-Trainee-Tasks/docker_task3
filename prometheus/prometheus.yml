global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: ollama-ecs
    dns_sd_configs:
      - names: ["ollama.task3.local"]
        type: A
        port: 9779
  - job_name: webui-ecs
    dns_sd_configs:
      - names: ["webui.task3.local"]
        type: A
        port: 9779
  - job_name: grafana-ecs
    dns_sd_configs:
      - names: ["grafana.task3.local"]
        type: A
        port: 9779
